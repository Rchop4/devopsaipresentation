name: ci-lab

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Keep token scope minimal even in the baseline pipeline.
permissions:
  contents: read

# Cancel superseded runs to reduce queue time and compute waste.
concurrency:
  group: ci-baseline-${{ github.ref }}
  cancel-in-progress: true

# This baseline workflow is intentionally simple so participants can identify
# clear optimisation opportunities during the workshop.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - name: Run tests
        run: npm test
