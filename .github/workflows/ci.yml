name: ci-lab
  # whitespace-trigger

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Keep token scope minimal even in the baseline pipeline.
permissions:
  contents: read

# Cancel superseded runs to reduce queue time and compute waste.
concurrency:
  group: ci-baseline-${{ github.ref }}
  cancel-in-progress: true

# This baseline workflow is intentionally simple so participants can identify
# clear optimisation opportunities during the workshop.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    # Test depends on build, but the workflow does not reuse a build artifact.
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Tests run in a single job with no sharding, so duration improvement is possible.
      - name: Run tests
        run: npm test

risk_assessment:
  if: github.event_name == 'pull_request'
  needs: [build, test]
  outputs:
    risk_score: ${{ steps.score.outputs.risk_score }}
    decision: ${{ steps.score.outputs.decision }}
  steps:
    - uses: actions/checkout@v5
    - id: changed_paths
      uses: dorny/paths-filter@v3
      with:
        filters: |
          workflow:
            - '.github/workflows/**'
          app_logic:
            - 'scripts/**'
            - 'package*.json'
    - id: score
      run: |
        score=4
        if [[ "${{ steps.changed_paths.outputs.workflow }}" == "true" ]]; then
          score=$((score + 7))
        fi
        if [[ "${{ steps.changed_paths.outputs.app_logic }}" == "true" ]]; then
          score=$((score + 5))
        fi
        if [[ "${{ github.event.pull_request.changed_files }}" -gt 20 ]]; then
          score=$((score + 4))
        fi
        if [[ "$score" -ge 15 ]]; then
          decision="no-go"
        elif [[ "$score" -ge 9 ]]; then
          decision="senior-review"
        else
          decision="normal-review"
        fi
        echo "risk_score=$score" >> "$GITHUB_OUTPUT"
        echo "decision=$decision" >> "$GITHUB_OUTPUT"
  deploy_preview_guarded:
    if: github.event_name == 'pull_request'
    needs: [build, test, risk_assessment]
    timeout-minutes: 5
    permissions:
      pull-requests: read
    environment:
      name: workshop-preview
    steps:
      - name: Block no-go risk levels
        if: needs.risk_assessment.outputs.decision == 'no-go'
        run: |
          echo "Risk score ${{ needs.risk_assessment.outputs.risk_score }} is no-go."
          echo "Apply mitigations, then rerun validation."
          exit 1
      - name: Require code owner (senior) approval for elevated risk
        if: needs.risk_assessment.outputs.decision == 'senior-review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          decision=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json reviewDecision -q .reviewDecision)
          echo "Review decision: $decision"
          if [[ "$decision" != "APPROVED" ]]; then
            echo "Missing required senior (code owner) approval"
            exit 1
          fi
      - name: Approval and rollback notes
        run: |
          echo "Guardrail check passed after build+test."
          echo "Risk score: ${{ needs.risk_assessment.outputs.risk_score }}"
          echo "Decision: ${{ needs.risk_assessment.outputs.decision }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          pr_number="${{ github.event.pull_request.number }}"
          echo "Rollback: git revert $head_sha"
          echo "(If PR #$pr_number is squash-merged, that SHA won't exist on main — instead run:"
          echo " gh pr view $pr_number --json mergeCommit -q .mergeCommit.oid"
          echo " then git revert <that SHA>.)"
